name: Build and release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress clean package

      - name: Generate random release values
        id: release
        shell: bash
        run: |
          tag="build-$(cat /proc/sys/kernel/random/uuid)"
          title="release-$(cat /proc/sys/kernel/random/uuid)"
          jar_path="$(find target -maxdepth 1 -type f -name 'mcgimtrash-*.jar' -print -quit)"
          test -n "$jar_path"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "jar_path=$jar_path" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          RELEASE_JAR: ${{ steps.release.outputs.jar_path }}
        run: |
          gh release create "$RELEASE_TAG" "$RELEASE_JAR" \
            --target "$GITHUB_SHA" \
            --title "$RELEASE_TITLE" \
            --notes "由 GitHub Actions 从提交 $GITHUB_SHA 自动构建。"
