name: mcgimtrash
version: 1.0.0
main: mcgimtrash.McGimTrash
author: ra1nyxin
api-version: '26.2'
description: Periodically sweeps ground items into a shared virtual trash bin.
commands:
  mcgimtrash:
    description: Opens the shared trash bin or reloads the plugin configuration.
    usage: /mcgimtrash [reload]
permissions:
  mcgimtrash.admin:
    description: Allows reloading the mcgimtrash configuration.
    default: op
