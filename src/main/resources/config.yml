# 每隔多少分钟自动清理一次地面掉落物。
# 可填写 1 到 10080，修改后执行重载命令即可生效。
sweep-interval-minutes: 30

# 完成多少次清扫后结束当前垃圾桶周期。
# 达到次数后不会立刻清空，而是在下一次清扫开始时清空旧内容。
sweeps-per-cycle: 10

# 清扫前多少秒发送全服提醒。
# 可以填写 1 到 30 个不重复的正整数，每个值都必须小于清扫间隔。
# 显示时，能整除为两分钟及以上的值使用分钟，其余值使用秒。
reminder-seconds:
  - 300
  - 60
  - 30
  - 10

# 全服提醒和清扫结果消息前显示的文字，长度为 1 到 32 个字符。
message-prefix: "[GIM]"
